spring:
  application:
    name: ingestion-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s       # FR-ING-11: finish in-flight requests within 30 s on SIGTERM
  # Agent registry in ingestion_db (spec 8.4), with the gateway's own role (database per service, rule 2).
  # Requests read it through R2DBC (non-blocking, FR-ING-02) ...
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/ingestion_db
    username: ${INGESTION_DB_USER:ingestion}
    password: ${INGESTION_DB_PASSWORD:ingestion_dev_only}   # local dev value from .env.example
  # ... and Flyway creates the schema once at start-up over JDBC (ADR-0008).
  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/ingestion_db
    user: ${INGESTION_DB_USER:ingestion}
    password: ${INGESTION_DB_PASSWORD:ingestion_dev_only}
    # db/dev-seed inserts the 35 simulator agents with PUBLIC dev keys. Production: GATEWAY_DB_LOCATIONS=classpath:db/migration
    locations: ${GATEWAY_DB_LOCATIONS:classpath:db/migration,classpath:db/dev-seed}

server:
  port: 8081                              # 8080 is used by a Pi-hole on the dev machine
  shutdown: graceful

# Spec 12.1: JSON logs on stdout with service and version (ECS format, built into Spring Boot 3.5).
# traceId / spanId join with OpenTelemetry (week 5, step B2).
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${gateway.version}

gateway:
  version: 0.1.0
  max-body-bytes: 262144                  # 256 KiB (spec 8.1)
  max-events: 100
  max-event-age: 24h
  max-clock-skew: 5m
  retry-after: 5s
  max-in-flight: 2000                     # spec 6.8; per-agent limits come from table agent (FR-ING-06)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    raw-topic: telemetry.raw.v1
    rejected-topic: telemetry.rejected.v1
  registry:
    cache-ttl: 10s                        # a revoked key stops working within 10 s (decided 2026-11-05)
    cache-max-size: 10000
    lookup-timeout: 2s

# Probes at /health/live and /health/ready, Prometheus metrics at /metrics (spec 8.2, FR-ING-09).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      service: ${spring.application.name}  # spec 12: every series says which service it comes from
    distribution:
      percentiles-histogram:
        http.server.requests: true         # histogram buckets, so Grafana can compute p95 across instances
        gateway.kafka.publish: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
