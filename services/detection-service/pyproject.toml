[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-service"
version = "0.1.0"
description = "Detection service. Stage 2: pass-through stub telemetry.raw.v1 -> telemetry.scored.v1 (spec FR-DET, CLAUDE.md step 2)"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.6,<3",   # spec 6.5
  "jsonschema>=4.18,<5",       # checks incoming records against libs/telemetry-contracts
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest>=8",
  "pytest-cov==7.1.0",
  "pip-audit==2.10.1",
  "import-linter==2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# spec 13.5: Python inference code >= 80 % (the Kafka loop is covered by the integration tests)
addopts = "--cov=detection_service --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: needs the compose Kafka on localhost:9092 (skipped when it is not reachable)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# explicit list, so a newer ruff cannot silently change what CI checks (spec 14.4 stage 1)
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE", "S"]
ignore = [
  "S311",   # random is used for simulation and jitter, never for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how tests check things

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# spec 13.5 "import-linter": the scoring logic must not depend on Kafka or on the service loop,
# so the real model can replace it and be tested without a broker.
[tool.importlinter]
root_package = "detection_service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "scoring is independent of Kafka and of the service loop"
type = "forbidden"
source_modules = ["detection_service.scoring", "detection_service.config"]
forbidden_modules = ["detection_service.service", "detection_service.__main__", "confluent_kafka"]
