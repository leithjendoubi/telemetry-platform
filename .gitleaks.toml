# Gitleaks configuration (CI stage 1, secrets scan). Read automatically from the repository root.
# Keeps every default rule and adds one narrow exception.

[extend]
useDefault = true

# SHA-256 hashes of the PUBLIC simulator dev keys 'dev-agent-<service>' (FR-ING-05: only hashes are stored).
# Verified 2026-11-05: each value equals sha256("dev-agent-<service>"). Two files hold them:
#   dev-agents.yml   the walking-skeleton configuration, deleted in week 5 but still in the Git history (scanned in CI)
#   R__dev_agents.sql  the dev seed of the agent registry in ingestion_db (week 5, step A3)
# The exception belongs to the generic-api-key rule only and needs both: one of these files AND a 64-hex-digit value.
# Every other rule still scans both files, and other files are untouched.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "SHA-256 hashes of public dev API keys"
condition = "AND"
paths = [
  '''(^|/)services/ingestion-gateway/src/main/resources/dev-agents\.yml$''',
  '''(^|/)services/ingestion-gateway/src/main/resources/db/dev-seed/R__dev_agents\.sql$''',
]
regexes = ['''^[0-9a-f]{64}$''']
