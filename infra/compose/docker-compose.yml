# Docker Compose stack, profile "core" (spec 6.7 R1, 14.2).
# Infrastructure: Kafka (KRaft, single broker) + topic creation, PostgreSQL/TimescaleDB with the three
# logical databases. Application services (walking skeleton, Stage 2): ingestion-gateway (host port 8081),
# detection-service (pass-through stub, no port), analytics-service (host port 8082).
# Port 8080 is avoided on purpose: a Pi-hole uses it on the development machine.
#
# From the repository root (PowerShell):
#   docker compose -f infra/compose/docker-compose.yml --profile core --env-file .env up -d --build --wait
#   docker compose -f infra/compose/docker-compose.yml --profile core down          # stop, keep data
#   docker compose -f infra/compose/docker-compose.yml --profile core down -v       # stop, DELETE all data

name: telemetry

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: telemetry-kafka
    hostname: kafka
    profiles: ["core"]
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL is for other containers (kafka:19092); EXTERNAL is for tools on your machine (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker (R1): replication factor 1 everywhere
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init so their settings are reviewed in Git
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: telemetry-kafka-init
    profiles: ["core"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: telemetry-timescaledb
    hostname: timescaledb
    profiles: ["core"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      INGESTION_DB_USER: ${INGESTION_DB_USER:-ingestion}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_dev_only}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_dev_only}
      ALERTING_DB_USER: ${ALERTING_DB_USER:-alerting}
      ALERTING_DB_PASSWORD: ${ALERTING_DB_PASSWORD:-alerting_dev_only}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # Runs once, on the first start with an empty data volume
      - ./init-db/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------- application services (Stage 2)
  # Images are built from the repository root (they need libs/telemetry-contracts).
  # read_only + tmpfs /tmp: the containers cannot change their own file system (spec 14.2).

  ingestion-gateway:
    build:
      context: ../..
      dockerfile: services/ingestion-gateway/Dockerfile
    image: telemetry/ingestion-gateway:0.1.0
    container_name: telemetry-ingestion-gateway
    profiles: ["core"]
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 35s              # FR-ING-11: 30 s to finish in-flight requests
    restart: unless-stopped

  detection-service:
    build:
      context: ../..
      dockerfile: services/detection-service/Dockerfile
    image: telemetry/detection-service:0.1.0
    container_name: telemetry-detection-service
    profiles: ["core"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 35s
    restart: unless-stopped             # exits with code 1 if Kafka refuses its outputs; restart resumes from the last commit

  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    image: telemetry/analytics-service:0.1.0
    container_name: telemetry-analytics-service
    profiles: ["core"]
    ports:
      - "${ANALYTICS_PORT:-8082}:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_dev_only}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  kafka-data:
  timescale-data:
