[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-sim"
version = "0.1.0"
description = "Deterministic fleet telemetry simulator for the event-driven telemetry platform (spec CAP-PFE-2026-TEL-084, FR-SIM-*)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pyarrow>=15.0",   # Parquet output (offline mode). CSV output works without it.
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.18",  # contract tests
  "pytest>=8.0",       # optional: the tests are plain unittest and also run under pytest
  "ruff",
  "mypy",
]

[project.scripts]
fleet-sim = "fleet_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
